Screens:
  ViewScreen:
    Properties:
      Fill: =RGBA(243, 242, 241, 1)
    Children:
      - recHeader:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =72
            Fill: =RGBA(0, 120, 212, 1)
      - btnBack:
          Control: Classic/Button
          Properties:
            Text: ="‹ 一覧"
            OnSelect: =Back(ScreenTransition.UnCover)
            X: =24
            Y: =16
            Width: =100
            Height: =40
            Size: =13
            Fill: =RGBA(0, 0, 0, 0)
            Color: =RGBA(255, 255, 255, 1)
            BorderThickness: =0
      - lblTitle:
          Control: Label
          Properties:
            Text: ="署名詳細"
            X: =140
            Y: =0
            Width: =300
            Height: =72
            Size: =20
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
      - lblCapName:
          Control: Label
          Properties:
            Text: ="顧客名"
            X: =40
            Y: =88
            Width: =334
            Height: =20
            Size: =10
            Color: =RGBA(96, 94, 92, 1)
      - lblValName:
          Control: Label
          Properties:
            Text: =varSelected.顧客名
            X: =40
            Y: =108
            Width: =334
            Height: =32
            Size: =14
            FontWeight: =FontWeight.Semibold
      - lblCapDate:
          Control: Label
          Properties:
            Text: ="署名日時"
            X: =394
            Y: =88
            Width: =334
            Height: =20
            Size: =10
            Color: =RGBA(96, 94, 92, 1)
      - lblValDate:
          Control: Label
          Properties:
            Text: |-
              =Text(varSelected.署名日時, "yyyy/mm/dd hh:mm")
            X: =394
            Y: =108
            Width: =334
            Height: =32
            Size: =14
      - lblCapEmail:
          Control: Label
          Properties:
            Text: ="メールアドレス"
            X: =40
            Y: =152
            Width: =334
            Height: =20
            Size: =10
            Color: =RGBA(96, 94, 92, 1)
      - lblValEmail:
          Control: Label
          Properties:
            Text: =varSelected.メールアドレス
            X: =40
            Y: =172
            Width: =334
            Height: =32
            Size: =13
      - lblCapPhone:
          Control: Label
          Properties:
            Text: ="電話番号"
            X: =394
            Y: =152
            Width: =334
            Height: =20
            Size: =10
            Color: =RGBA(96, 94, 92, 1)
      - lblValPhone:
          Control: Label
          Properties:
            Text: =varSelected.電話番号
            X: =394
            Y: =172
            Width: =334
            Height: =32
            Size: =13
      - lblCapMaker:
          Control: Label
          Properties:
            Text: ="メーカー"
            X: =40
            Y: =216
            Width: =216
            Height: =20
            Size: =10
            Color: =RGBA(96, 94, 92, 1)
      - lblValMaker:
          Control: Label
          Properties:
            Text: =varSelected.メーカー
            X: =40
            Y: =236
            Width: =216
            Height: =32
            Size: =13
      - lblCapModel:
          Control: Label
          Properties:
            Text: ="型式"
            X: =276
            Y: =216
            Width: =216
            Height: =20
            Size: =10
            Color: =RGBA(96, 94, 92, 1)
      - lblValModel:
          Control: Label
          Properties:
            Text: =varSelected.型式
            X: =276
            Y: =236
            Width: =216
            Height: =32
            Size: =13
      - lblCapSerial:
          Control: Label
          Properties:
            Text: ="機番"
            X: =512
            Y: =216
            Width: =216
            Height: =20
            Size: =10
            Color: =RGBA(96, 94, 92, 1)
      - lblValSerial:
          Control: Label
          Properties:
            Text: =varSelected.機番
            X: =512
            Y: =236
            Width: =216
            Height: =32
            Size: =13
      - lblCapType:
          Control: Label
          Properties:
            Text: ="署名種別"
            X: =40
            Y: =280
            Width: =334
            Height: =20
            Size: =10
            Color: =RGBA(96, 94, 92, 1)
      - lblValType:
          Control: Label
          Properties:
            Text: =varSelected.署名種別.Value
            X: =40
            Y: =300
            Width: =334
            Height: =32
            Size: =13
      - lblCapStatus:
          Control: Label
          Properties:
            Text: ="ステータス"
            X: =394
            Y: =280
            Width: =334
            Height: =20
            Size: =10
            Color: =RGBA(96, 94, 92, 1)
      - lblValStatus:
          Control: Label
          Properties:
            Text: =varSelected.ステータス.Value
            X: =394
            Y: =300
            Width: =120
            Height: =32
            Size: =12
            Align: =Align.Center
            Fill: |-
              =If(varSelected.ステータス.Value = "完了", RGBA(223, 246, 221, 1), RGBA(237, 235, 233, 1))
            Color: |-
              =If(varSelected.ステータス.Value = "完了", RGBA(16, 124, 16, 1), RGBA(96, 94, 92, 1))
      - lblCapConsent:
          Control: Label
          Properties:
            Text: ="同意内容（署名時に表示した文言）"
            X: =40
            Y: =344
            Width: =688
            Height: =20
            Size: =10
            Color: =RGBA(96, 94, 92, 1)
      - txtConsentView:
          Control: Classic/TextInput
          Properties:
            Mode: =TextMode.MultiLine
            DisplayMode: =DisplayMode.View
            Default: =varSelected.同意内容
            X: =40
            Y: =366
            Width: =688
            Height: =140
            Size: =11
            Color: =RGBA(50, 49, 48, 1)
            Fill: =RGBA(255, 255, 255, 1)
      - lblCapSignature:
          Control: Label
          Properties:
            Text: ="署名"
            X: =40
            Y: =520
            Width: =688
            Height: =20
            Size: =10
            Color: =RGBA(96, 94, 92, 1)
      - recSignatureBg:
          Control: Rectangle
          Properties:
            X: =40
            Y: =542
            Width: =688
            Height: =190
            Fill: =RGBA(255, 255, 255, 1)
      - imgSignature:
          Control: Image
          Properties:
            Image: =varSelected.署名画像.Full
            ImagePosition: =ImagePosition.Fit
            Visible: |-
              =varSelected.署名種別.Value = "手書き署名"
            X: =40
            Y: =542
            Width: =688
            Height: =190
      - lblTextSignature:
          Control: Label
          Properties:
            Text: =varSelected.テキスト代替署名
            Visible: |-
              =varSelected.署名種別.Value = "テキスト署名"
            X: =40
            Y: =542
            Width: =688
            Height: =190
            Size: =28
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Font: =Font.Georgia
            Italic: =true
      - btnBackBottom:
          Control: Classic/Button
          Properties:
            Text: ="一覧に戻る"
            OnSelect: =Back(ScreenTransition.UnCover)
            X: =224
            Y: =760
            Width: =320
            Height: =48
            Size: =14
            Fill: =RGBA(0, 120, 212, 1)
            Color: =RGBA(255, 255, 255, 1)
