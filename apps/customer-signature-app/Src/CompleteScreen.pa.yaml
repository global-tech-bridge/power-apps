Screens:
  CompleteScreen:
    Properties:
      Fill: =RGBA(243, 242, 241, 1)
    Children:
      - lblCheckMark:
          Control: Label
          Properties:
            Text: ="✓"
            X: =0
            Y: =200
            Width: =Parent.Width
            Height: =120
            Size: =72
            Align: =Align.Center
            Color: =RGBA(16, 124, 16, 1)
      - lblCompleteTitle:
          Control: Label
          Properties:
            Text: ="署名を受け付けました"
            X: =0
            Y: =330
            Width: =Parent.Width
            Height: =60
            Size: =28
            Align: =Align.Center
            FontWeight: =FontWeight.Semibold
      - lblCompleteNote:
          Control: Label
          Properties:
            Text: ="ご協力ありがとうございました。この画面を担当者にお見せください。"
            X: =0
            Y: =396
            Width: =Parent.Width
            Height: =40
            Size: =14
            Align: =Align.Center
            Color: =RGBA(96, 94, 92, 1)
      - btnNewSignature:
          Control: Classic/Button
          Properties:
            Text: ="新しい署名を開始"
            OnSelect: =Navigate(SignScreen, ScreenTransition.Fade)
            X: =543
            Y: =480
            Width: =280
            Height: =52
            Size: =14
            Fill: =RGBA(0, 120, 212, 1)
            Color: =RGBA(255, 255, 255, 1)
