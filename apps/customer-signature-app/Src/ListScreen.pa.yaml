Screens:
  ListScreen:
    Properties:
      Fill: =RGBA(243, 242, 241, 1)
      OnVisible: =Reset(txtSearch)
    Children:
      - recHeader:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =72
            Fill: =RGBA(0, 120, 212, 1)
      - lblTitle:
          Control: Label
          Properties:
            Text: ="顧客署名 一覧"
            X: =40
            Y: =0
            Width: =400
            Height: =72
            Size: =20
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
      - lblCount:
          Control: Label
          Properties:
            Text: |-
              ="表示 " & CountRows(galSignatures.AllItems) & " 件"
            X: =400
            Y: =0
            Width: =328
            Height: =72
            Size: =11
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
      - txtSearch:
          Control: Classic/TextInput
          Properties:
            Default: =""
            HintText: ="顧客名・メーカー・型式・機番で検索（前方一致）"
            X: =40
            Y: =88
            Width: =488
            Height: =44
            Size: =12
      - btnNew:
          Control: Classic/Button
          Properties:
            Text: ="＋ 新規署名"
            OnSelect: =Navigate(SignScreen, ScreenTransition.Cover)
            X: =548
            Y: =88
            Width: =180
            Height: =44
            Size: =13
            Fill: =RGBA(0, 120, 212, 1)
            Color: =RGBA(255, 255, 255, 1)
      - galSignatures:
          Control: Gallery
          Variant: galleryVertical
          Properties:
            Items: |-
              =Sort(
                  Filter(
                      顧客署名,
                      IsBlank(txtSearch.Text) ||
                      StartsWith(顧客名, txtSearch.Text) ||
                      StartsWith(メーカー, txtSearch.Text) ||
                      StartsWith(型式, txtSearch.Text) ||
                      StartsWith(機番, txtSearch.Text)
                  ),
                  署名日時,
                  SortOrder.Descending
              )
            OnSelect: |-
              =Set(varSelected, ThisItem);
              Navigate(ViewScreen, ScreenTransition.Cover)
            Layout: =Layout.Vertical
            TemplateSize: =96
            TemplatePadding: =0
            ShowScrollbar: =true
            X: =40
            Y: =148
            Width: =688
            Height: =Parent.Height - Self.Y - 24
          Children:
            - recRowBg:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =4
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight - 8
                  Fill: =RGBA(255, 255, 255, 1)
                  OnSelect: =Select(Parent)
            - lblRowName:
                Control: Label
                Properties:
                  Text: =ThisItem.顧客名
                  X: =16
                  Y: =12
                  Width: =440
                  Height: =30
                  Size: =14
                  FontWeight: =FontWeight.Semibold
                  OnSelect: =Select(Parent)
            - lblRowMachine:
                Control: Label
                Properties:
                  Text: |-
                    =Trim(ThisItem.メーカー & " " & ThisItem.型式) & If(!IsBlank(ThisItem.機番), "　機番: " & ThisItem.機番)
                  X: =16
                  Y: =42
                  Width: =520
                  Height: =24
                  Size: =11
                  Color: =RGBA(50, 49, 48, 1)
                  OnSelect: =Select(Parent)
            - lblRowDate:
                Control: Label
                Properties:
                  Text: |-
                    =Text(ThisItem.署名日時, "yyyy/mm/dd hh:mm") & "　" & ThisItem.署名種別.Value
                  X: =16
                  Y: =64
                  Width: =520
                  Height: =22
                  Size: =10
                  Color: =RGBA(96, 94, 92, 1)
                  OnSelect: =Select(Parent)
            - lblRowStatus:
                Control: Label
                Properties:
                  Text: =ThisItem.ステータス.Value
                  X: =Parent.TemplateWidth - 148
                  Y: =16
                  Width: =96
                  Height: =28
                  Size: =11
                  Align: =Align.Center
                  Fill: |-
                    =If(ThisItem.ステータス.Value = "完了", RGBA(223, 246, 221, 1), RGBA(237, 235, 233, 1))
                  Color: |-
                    =If(ThisItem.ステータス.Value = "完了", RGBA(16, 124, 16, 1), RGBA(96, 94, 92, 1))
                  OnSelect: =Select(Parent)
            - lblRowChevron:
                Control: Label
                Properties:
                  Text: ="›"
                  X: =Parent.TemplateWidth - 44
                  Y: =0
                  Width: =28
                  Height: =Parent.TemplateHeight
                  Size: =24
                  Align: =Align.Center
                  Color: =RGBA(96, 94, 92, 1)
                  OnSelect: =Select(Parent)
      - lblEmpty:
          Control: Label
          Properties:
            Text: ="該当する署名はありません。"
            Visible: =CountRows(galSignatures.AllItems) = 0
            X: =40
            Y: =200
            Width: =688
            Height: =40
            Size: =13
            Align: =Align.Center
            Color: =RGBA(96, 94, 92, 1)
