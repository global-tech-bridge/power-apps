- btnNewSignature:
    Control: Classic/Button
    Properties:
      Text: ="新しい署名を開始する"
      OnSelect: |-
        =Set(varRecordId, 0);
        Set(varEdit, Defaults(SignatureCases));
        Set(varRequestId, "");
        Set(varSignatureBase64, "");
        // 次回以降の初期値として今回選んだ組織を保持する（要件定義 11.2）
        Set(varDefaultBranch, varCompleted.BranchName);
        Set(varDefaultBlock, varCompleted.BlockName);
        Set(varDefaultSite, varCompleted.SiteName);
        Navigate(EditScreen, ScreenTransition.Fade)
      X: =84
      Y: =700
      Width: =292
      Height: =54
      Size: =14
      Fill: =RGBA(0, 120, 212, 1)
      Color: =RGBA(255, 255, 255, 1)
      FontWeight: =FontWeight.Semibold
- btnDetail:
    Control: Classic/Button
    Properties:
      Text: ="この案件の詳細を見る"
      OnSelect: |-
        =Set(varSelected, varCompleted);
        Set(varRecordId, varCompleted.ID);
        Navigate(DetailScreen, ScreenTransition.Fade)
      X: =392
      Y: =700
      Width: =292
      Height: =54
      Size: =13
- btnToList:
    Control: Classic/Button
    Properties:
      Text: ="一覧に戻る"
      OnSelect: |-
        =Set(varDefaultBranch, varCompleted.BranchName);
        Set(varDefaultBlock, varCompleted.BlockName);
        Set(varDefaultSite, varCompleted.SiteName);
        Navigate(ListScreen, ScreenTransition.Fade)
      X: =84
      Y: =770
      Width: =600
      Height: =46
      Size: =12
